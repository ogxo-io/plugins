<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121419;
  --frame: #181b21;
  --bar: #1f232a;
  --fg: #c0c6d0;
  --hi: #eef1f6;
  --dim: #5f6878;
  --faint: #353b47;
  --fable: #a99cf6;
  --opus: #f0a35e;
  --sonnet: #72a9f2;
  --haiku: #88d08c;
  --grok: #f27d98;
  --codex: #5fd0c4;
  --ok: #88d08c;
  --err: #f26d6d;
  --warn: #e9c85c;
  --hl: rgba(240, 163, 94, 0.13);
  --hlerr: rgba(242, 109, 109, 0.15);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e6e9ee;
    --frame: #f6f7f9;
    --bar: #eceff3;
    --fg: #2f3540;
    --hi: #0f1319;
    --dim: #7f8898;
    --faint: #cdd2da;
    --fable: #6450d6;
    --opus: #b35d14;
    --sonnet: #2467bf;
    --haiku: #2f8736;
    --grok: #c2345a;
    --codex: #127f74;
    --ok: #2f8736;
    --err: #c63636;
    --warn: #8f7000;
    --hl: rgba(179, 93, 20, 0.1);
    --hlerr: rgba(198, 54, 54, 0.1);
  }
}
:root[data-theme="light"] {
  --bg: #e6e9ee;
  --frame: #f6f7f9;
  --bar: #eceff3;
  --fg: #2f3540;
  --hi: #0f1319;
  --dim: #7f8898;
  --faint: #cdd2da;
  --fable: #6450d6;
  --opus: #b35d14;
  --sonnet: #2467bf;
  --haiku: #2f8736;
  --grok: #c2345a;
  --codex: #127f74;
  --ok: #2f8736;
  --err: #c63636;
  --warn: #8f7000;
  --hl: rgba(179, 93, 20, 0.1);
  --hlerr: rgba(198, 54, 54, 0.1);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.5;
  font-variant-ligatures: none;
  font-feature-settings: "liga" 0, "calt" 0;
  padding: 24px 16px;
  min-height: 100vh;
}
.window {
  max-width: 1320px;
  margin: 0 auto;
  background: var(--frame);
  border: 1px solid var(--faint);
  border-radius: 10px;
  overflow: hidden;
}
.titlebar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  background: var(--bar);
  border-bottom: 1px solid var(--faint);
  color: var(--dim);
  font-size: 12px;
}
.titlebar i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.titlebar i:nth-child(1) { background: #f2605a; }
.titlebar i:nth-child(2) { background: #f5bd4f; }
.titlebar i:nth-child(3) { background: #5fc454; }
.titlebar span { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titlebar a { color: var(--dim); text-decoration: none; white-space: nowrap; border-radius: 3px; outline-offset: 2px; }
.titlebar a:hover { color: var(--hi); }
.titlebar a:focus-visible { outline: 2px solid var(--sonnet); }
main { padding: 18px 20px 14px; }
pre {
  margin: 0;
  font: inherit;
  white-space: pre;
  overflow: hidden;
}
.gap { height: 1.5em; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 2ch; }
@media (max-width: 900px) {
  .pair { grid-template-columns: 1fr; }
  .pair > pre + pre { margin-top: 1.5em; }
}
@media (max-width: 600px) {
  body { font-size: 11px; padding: 12px 8px; }
  main { padding: 12px 10px; }
}
#probe { position: absolute; visibility: hidden; white-space: pre; }
pre .ln { display: block; min-height: 1.5em; }

.fg { color: var(--fg); }
.hi { color: var(--hi); }
.dim { color: var(--dim); }
.faint { color: var(--faint); }
.fable { color: var(--fable); }
.opus { color: var(--opus); }
.sonnet { color: var(--sonnet); }
.haiku { color: var(--haiku); }
.grok { color: var(--grok); }
.codex { color: var(--codex); }
.main { color: var(--hi); }
.ok { color: var(--ok); }
.err { color: var(--err); }
.warn { color: var(--warn); }
.b { font-weight: 700; }
.hl { background: var(--hl); }
.hlerr { background: var(--hlerr); }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><i></i><i></i><i></i><span id="wtitle">route board</span><a id="hub" href="../index.html">all boards</a></div>
  <main>
    <pre id="head" aria-live="off"></pre>
    <div class="gap"></div>
    <pre id="tree"></pre>
    <div class="gap"></div>
    <pre id="batch"></pre>
    <pre id="time"></pre>
    <div class="gap"></div>
    <div class="pair">
      <pre id="tiers"></pre>
      <pre id="log"></pre>
    </div>
    <div class="gap"></div>
    <div id="errwrap" hidden><pre id="errors"></pre><div class="gap"></div></div>
    <pre id="usage"></pre>
    <div class="gap"></div>
    <pre id="foot"></pre>
  </main>
</div>
<span id="probe">MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM</span>
<script>
(() => {
  'use strict';

  const params = new URLSearchParams(location.search);
  const DEMO = params.has('demo');
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TIERS = ['fable', 'opus', 'sonnet', 'haiku', 'grok', 'codex'];
  const RANK = { haiku: 1, sonnet: 2, opus: 3, fable: 4 };
  // ogxo-route worker pins, shown until the dispatch reports its resolved model.
  const PINS = {
    'ogxo-route:scout': 'sonnet', 'ogxo-route:implementer': 'sonnet', 'ogxo-route:e2e-runner': 'sonnet',
    'ogxo-route:test-runner': 'haiku', 'ogxo-route:verifier': 'haiku', 'ogxo-route:log-extractor': 'haiku',
  };
  const EFFORT = {
    'ogxo-route:scout': 'low', 'ogxo-route:implementer': 'med', 'ogxo-route:e2e-runner': 'med',
    'ogxo-route:implementer-risky': 'high',
  };
  const ALIAS = { 'general-purpose': 'general', 'implementer-risky': 'impl-risky', 'code-review-agent': 'code-review' };
  // limits:begin
  // Plan usage from dash/limits.js, which ogxo-statusline writes as
  // L({t, h5: {p, r}, d7: {p, r}, sp: {p, r}}): p is percent used, r the
  // window's reset time and t the reading's time, both in epoch seconds.
  // Returns [text, class] parts to print in order, or [] without data.
  function limitParts(lim, nowMs) {
    if (!lim || typeof lim !== 'object' || typeof lim.t !== 'number') return [];
    const p2 = (n) => String(n).padStart(2, '0');
    const when = (ms) => {
      const d = new Date(ms);
      const hm = `${p2(d.getHours())}:${p2(d.getMinutes())}`;
      if (d.toDateString() === new Date(nowMs).toDateString()) return hm;
      return `${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()]} ${d.getDate()} ${hm}`;
    };
    const parts = [];
    for (const [k, label] of [['h5', '5h'], ['d7', 'week'], ['sp', 'spend']]) {
      const w = lim[k];
      if (!w || typeof w.p !== 'number') continue;
      const r = typeof w.r === 'number' ? w.r * 1000 : null;
      // The window rolled over after the reading: its new usage is unknown.
      if (r != null && r <= nowMs) { parts.push([`${label} reset at ${when(r)}`, 'dim']); continue; }
      const left = Math.max(0, Math.min(100, Math.round(100 - w.p)));
      parts.push([`${label} ${left}% left` + (r != null ? `, resets ${when(r)}` : ''), left < 10 ? 'err' : left < 25 ? 'warn' : 'fg']);
    }
    const age = nowMs - lim.t * 1000;
    if (parts.length && age > 10 * 60000) {
      parts.push([`as of ${age >= 3600000 ? Math.floor(age / 3600000) + 'h' : Math.round(age / 60000) + 'm'} ago`, 'dim']);
    }
    return parts;
  }
  // limits:end

  // List prices in USD per million tokens (Anthropic API, 2026-09-25):
  // input, output, 5-minute cache write, 1-hour cache write, cache read.
  // First matching prefix wins. Update with the price list; hub.html has
  // the same table.
  const PRICES = [
    ['claude-fable-5', 10, 50, 12.5, 20, 0.25], ['claude-mythos-5', 10, 50, 12.5, 20, 0.25],
    ['claude-opus-5-5', 4, 20, 5, 8, 0.2], ['claude-opus', 5, 25, 6.25, 10, 0.5],
    ['claude-sonnet-5', 2, 10, 2.5, 4, 0.2], ['claude-sonnet-4', 3, 15, 3.75, 6, 0.3],
    ['claude-haiku-4-5', 1, 5, 1.25, 2, 0.1],
  ];
  const priceOf = (m) => PRICES.find(([p]) => String(m || '').startsWith(p)) || null;
  // Cost of one usage record {in, out, cr, cw5, cw1} at a model's list price, or null.
  // A record with c carries the cost its host computed (Grok Build does), used as is.
  const costOf = (u, m) => {
    if (u && typeof u.c === 'number') return u.c;
    const p = priceOf(m);
    if (!p) return null;
    return ((u.in || 0) * p[1] + (u.out || 0) * p[2] + (u.cw5 || 0) * p[3] + (u.cw1 || 0) * p[4] + (u.cr || 0) * p[5]) / 1e6;
  };
  const usd = (n) => (n == null ? '  n/a' : n >= 100 ? '$' + n.toFixed(0) : '$' + n.toFixed(2));
  const SPIN = ['|', '/', '-', '\\'];

  // ---------- theme ----------
  try {
    const saved = localStorage.getItem('ogxo-route-theme');
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) { /* storage blocked */ }
  addEventListener('keydown', (e) => {
    if (e.key !== 't' || e.metaKey || e.ctrlKey || e.altKey) return;
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('ogxo-route-theme', root.dataset.theme); } catch (err) { /* ignore */ }
  });

  // ---------- state ----------
  let S;
  function reset() {
    S = {
      t0: null, tAct: null, last: 0, sid: '', repo: '', branch: '', wt: '', host: '',
      working: false, ended: false, turnAt: null, turns: [],
      main: { key: 'main', ty: 'main', tools: [], tc: 0, marks: [] },
      agents: new Map(), byU: new Map(), byId: new Map(), pending: [],
      tools: new Map(), log: [], batch: null, errs: [],
      tierTools: {}, tierAgents: {}, toolCount: 0, errors: 0, offline: false, loaded: false,
      advisor: [], waits: 0,
      // Token usage records: {who: 'main' | 'advisor' | agent key, m: model, u: {in, out, cr, cw5, cw1}}.
      use: [], usePartial: false,
    };
  }
  reset();

  const tierOf = (m) => {
    const s = String(m || '').toLowerCase();
    for (const k of ['fable', 'opus', 'sonnet', 'haiku']) if (s.includes(k)) return k;
    return null;
  };
  // The pins are Claude Code's: Grok Build ignores an agent file's model and
  // runs workers on the session's model unless the dispatch names one.
  const agentTier = (a) => a.x || tierOf(a.rm) || tierOf(a.m) || (S.host === 'grok' ? null : tierOf(PINS[a.ty])) || 'main';
  const shortType = (ty) => {
    const t = String(ty || 'agent');
    const s = (t.includes(':') ? t.slice(t.indexOf(':') + 1) : t).toLowerCase();
    return ALIAS[s] || s;
  };
  const labelOf = (k) => (k === 'main' ? 'main' : shortType(S.agents.get(k)?.ty));

  function newAgent(key, props) {
    const a = Object.assign({
      key, ty: 'general-purpose', d: '', m: null, rm: null, x: null, parent: null,
      t0: Date.now(), t1: null, state: 'start', verdict: null, tools: [], tc: 0, marks: [],
      out: 0, returnAt: null,
    }, props);
    S.agents.set(key, a);
    return a;
  }

  function callerKey(ev) {
    if (!ev.a) return 'main';
    let k = S.byId.get(ev.a);
    if (!k) {
      k = 'id:' + ev.a;
      newAgent(k, { ty: ev.at || 'general-purpose', t0: ev.t, state: 'run', id: ev.a });
      S.byId.set(ev.a, k);
    }
    return k;
  }
  const actor = (k) => (k === 'main' ? S.main : S.agents.get(k));

  function addLog(t, k, verb, text, cls) {
    S.log.push({ t, k, verb, text: text || '', cls });
    if (S.log.length > 400) S.log.splice(0, S.log.length - 400);
  }
  function mark(obj, t, kind) {
    obj.marks.push({ t, kind });
    if (obj.marks.length > 6000) obj.marks.splice(0, 1000);
  }

  // A use map is {model: {in, out, cr, cw5, cw1}}; "adv:<model>" keys are the
  // advisor's own tokens inside the main session's messages.
  function addUse(who, map) {
    if (!map || typeof map !== 'object') return;
    for (const [k, u] of Object.entries(map)) {
      if (!u || typeof u !== 'object') continue;
      const adv = k.startsWith('adv:');
      S.use.push({ who: adv ? 'advisor' : who, m: adv ? k.slice(4) : k, u });
    }
  }

  function ingest(ev) {
    if (!ev || typeof ev !== 'object') return;
    const t = typeof ev.t === 'number' ? ev.t : Date.now();
    if (S.t0 == null || t < S.t0) S.t0 = t;
    if (ev.e !== 'on' && (S.tAct == null || t < S.tAct)) S.tAct = t;
    S.last = Math.max(S.last, t);
    switch (ev.e) {
      case 'on':
        S.sid = ev.sid || S.sid; S.repo = ev.repo || S.repo; S.branch = ev.branch || S.branch; S.wt = ev.wt || '';
        S.host = ev.host || S.host;
        S.ended = false;
        addLog(t, 'main', 'board', 'dashboard on', 'dim');
        break;
      case 'prompt':
        S.working = true; S.turnAt = t; S.turns.push([t, null]); S.main.wait = null;
        addLog(t, 'main', 'prompt', 'new turn', 'hi');
        break;
      case 'stop':
        if (S.turns.length && S.turns[S.turns.length - 1][1] == null) S.turns[S.turns.length - 1][1] = t;
        S.working = false; S.turnAt = null; S.main.wait = null;
        addLog(t, 'main', 'idle', 'turn finished', 'dim');
        break;
      case 'end':
        S.ended = true; S.working = false;
        if (S.turns.length && S.turns[S.turns.length - 1][1] == null) S.turns[S.turns.length - 1][1] = t;
        addLog(t, 'main', 'end', 'session ended', 'dim');
        break;
      case 'dispatch': {
        const key = 'u:' + ev.u;
        const a = newAgent(key, { ty: ev.ty || 'general-purpose', d: ev.d || '', m: ev.m || null, bg: !!ev.bg, parent: ev.a ? callerKey(ev) : null, t0: t, u: ev.u });
        S.byU.set(ev.u, key); S.pending.push(key);
        touchMain(ev, t);
        addLog(t, a.parent || 'main', 'dispatch', `${shortType(a.ty)}  ${a.d}`, agentTier(a));
        break;
      }
      case 'sstart': {
        let key = S.byId.get(ev.id);
        if (!key) {
          // bf: added from the worker's transcript when the board was turned on.
          const i = ev.bf ? -1 : S.pending.findIndex((pk) => String(S.agents.get(pk).ty).toLowerCase() === String(ev.ty || '').toLowerCase());
          if (i >= 0) key = S.pending.splice(i, 1)[0];
          else { key = 'id:' + ev.id; newAgent(key, { ty: ev.ty || 'general-purpose', d: ev.d || '', t0: t }); }
          S.byId.set(ev.id, key);
        }
        const a = S.agents.get(key);
        a.id = ev.id; if (a.state === 'start') a.state = 'run';
        if (ev.rm && !a.rm) a.rm = ev.rm;
        if (ev.bf) a.bf = true;
        break;
      }
      case 'launched': {
        let key = S.byU.get(ev.u);
        if (!key) { key = 'u:' + ev.u; newAgent(key, { ty: ev.ty || 'general-purpose', t0: t, u: ev.u }); S.byU.set(ev.u, key); }
        const a = S.agents.get(key);
        if (ev.id) {
          const other = S.byId.get(ev.id);
          if (other && other !== key) {
            // Two same-type dispatches paired the wrong way round: swap what the dispatch said.
            const b = S.agents.get(other);
            for (const f of ['d', 'm', 'u', 'bg', 'parent']) { const v = a[f]; a[f] = b[f]; b[f] = v; }
            S.byU.set(b.u, other); S.byU.set(a.u, key);
            b.rm = ev.rm || b.rm; b.d = b.d || ev.d || '';
            break;
          }
          S.byId.set(ev.id, key); a.id = ev.id;
          const pi = S.pending.indexOf(key); if (pi >= 0) S.pending.splice(pi, 1);
        }
        if (ev.rm) a.rm = ev.rm;
        if (ev.d && !a.d) a.d = ev.d;
        if (ev.done) {
          a.t1 = a.t1 || t; a.tc = Math.max(a.tc, ev.tc || 0); a.out = ev.out || a.out;
          if (a.state === 'run' || a.state === 'start') { a.state = 'ok'; a.returnAt = t; }
        } else if (a.state === 'start') a.state = 'run';
        break;
      }
      case 'sstop': {
        if (!ev.id) break;
        // Claude Code's own helpers (for example the progress summaries it
        // writes while background agents run) fire SubagentStop with no
        // agent type and no start or dispatch before it: not a worker.
        if (!S.byId.has(ev.id) && !ev.ty) break;
        const key = S.byId.get(ev.id) || callerKey({ a: ev.id, at: ev.ty, t });
        const a = S.agents.get(key);
        a.t1 = t; a.returnAt = t; a.verdict = ev.v || null; a.out = ev.out || a.out; a.wait = null;
        if (ev.tc) a.tc = Math.max(a.tc, ev.tc);
        addUse(key, ev.use);
        a.state = ev.v === 'FAIL' ? 'fail' : ev.v === 'RISKY' ? 'risky' : ev.v === 'PASS' ? 'pass' : 'ok';
        const pi = S.pending.indexOf(key); if (pi >= 0) S.pending.splice(pi, 1);
        addLog(t, key, 'return', ev.v ? `VERDICT ${ev.v}` : (a.d || 'done'), ev.v === 'FAIL' ? 'err' : ev.v === 'RISKY' ? 'warn' : 'ok');
        break;
      }
      case 'tool': {
        // Claude Code's own helpers also run tools, under an agent id that
        // never started and with no agent type; a worker's calls carry its type.
        if (ev.a && !S.byId.has(ev.a) && !ev.at) break;
        let key = callerKey(ev);
        if (key === 'main') touchMain(ev, t);
        const who = actor(key);
        who.wait = null;
        const rec = { n: ev.n || 'tool', s: ev.s || '', t, ok: null };
        const wtm = key !== 'main' && /(?:^|\/)\.claude\/worktrees\/([^/\s]+)\//.exec(rec.s);
        if (wtm) who.wt = wtm[1];
        pushTool(who, rec, t);
        S.tools.set(ev.u, rec);
        S.toolCount++;
        const tier = key === 'main' ? 'main' : agentTier(who);
        S.tierTools[tier] = (S.tierTools[tier] || 0) + 1;
        if (ev.x) {
          const xk = 'x:' + ev.x;
          let xa = S.agents.get(xk);
          if (!xa) xa = newAgent(xk, { ty: ev.x, x: ev.x, t0: t, d: 'bridge run', parent: key === 'main' ? null : key });
          xa.state = 'run'; xa.t1 = null;
          if (/\brun\b/.test(ev.s)) xa.d = ev.s.replace(/^\S+\s*/, '') || xa.d;
          if (/\b(show|result)\b/.test(ev.s)) { xa.state = 'ok'; xa.returnAt = t; xa.t1 = t; }
          pushTool(xa, { n: ev.x, s: ev.s, t, ok: null }, t);
          S.tierTools[ev.x] = (S.tierTools[ev.x] || 0) + 1;
        }
        addLog(t, key, rec.n, rec.s, null);
        break;
      }
      case 'tool_ok': {
        if (ev.a && !S.byId.has(ev.a)) break;
        actor(callerKey(ev)).wait = null;
        const rec = S.tools.get(ev.u);
        if (rec) { rec.ok = true; S.tools.delete(ev.u); }
        break;
      }
      case 'tool_err': {
        if (ev.a && !S.byId.has(ev.a) && !S.tools.has(ev.u)) break;
        const key = callerKey(ev);
        const rec = S.tools.get(ev.u);
        if (rec) { rec.ok = false; S.tools.delete(ev.u); }
        S.errors++;
        S.errs.push({ t, k: key, n: ev.n || (rec && rec.n) || 'tool', s: rec ? rec.s : '', r: typeof ev.r === 'string' ? ev.r : '' });
        if (S.errs.length > 500) S.errs.splice(0, S.errs.length - 500);
        actor(key).wait = null;
        mark(actor(key), t, 'err');
        addLog(t, key, 'failed', `${ev.n || (rec && rec.n) || 'tool'} ${rec ? rec.s : ''}`, 'err');
        break;
      }
      case 'use':
      case 'usenote':
        if (ev.e === 'usenote') { S.usePartial = true; break; }
        // With an id: a worker's totals, recorded after it returned (Grok Build).
        if (ev.id) { const k = S.byId.get(ev.id); if (k) addUse(k, ev.use); break; }
        addUse('main', ev.use);
        break;
      case 'advisor':
        S.advisor.push(t);
        mark(S.main, t, 'adv');
        addLog(t, 'main', 'advisor', 'advisor consulted', 'fable');
        break;
      case 'perm':
      case 'wait': {
        // Claude Code is waiting on the user: a permission dialog or a request
        // for input. One prompt can send both events; count it once.
        if (ev.e === 'wait' && ev.k === 'idle_prompt') break;
        const key = callerKey(ev);
        const who = actor(key);
        const what = ev.e === 'perm' ? `permission for ${ev.n || 'a tool'}`
          : ev.k === 'permission_prompt' ? 'permission prompt'
          : ev.k === 'agent_needs_input' ? 'needs your input' : (ev.k || 'waiting');
        if (who.wait) { if (ev.e === 'perm') who.wait.what = what; break; }
        who.wait = { t, what };
        S.waits++;
        mark(who, t, 'wait');
        addLog(t, key, 'waits', what, 'warn');
        break;
      }
      case 'batch':
        S.batch = { t, rows: Array.isArray(ev.rows) ? ev.rows : [], mode: ev.mode || '' };
        addLog(t, 'main', 'batch', `${S.batch.rows.length} tasks`, 'opus');
        break;
      default:
        break;
    }
  }
  function touchMain(ev, t) {
    if (!S.working && !S.ended) { S.working = true; S.turns.push([t, null]); S.turnAt = t; }
  }
  function pushTool(who, rec, t) {
    who.tools.push(rec);
    if (who.tools.length > 4) who.tools.shift();
    who.tc++;
    mark(who, t, 'tool');
  }

  // ---------- char grid ----------
  class Grid {
    constructor(w, h) {
      this.w = w; this.h = h;
      this.c = new Array(w * h).fill(' ');
      this.k = new Array(w * h).fill('');
    }
    put(x, y, s, k = '') {
      s = String(s);
      if (y < 0 || y >= this.h) return;
      for (let i = 0; i < s.length; i++) {
        const xx = x + i;
        if (xx < 0 || xx >= this.w) continue;
        const j = y * this.w + xx;
        this.c[j] = s[i]; this.k[j] = k;
      }
    }
    paint(x, y, len, k) {
      if (y < 0 || y >= this.h) return;
      for (let i = 0; i < len; i++) {
        const xx = x + i;
        if (xx < 0 || xx >= this.w) continue;
        const j = y * this.w + xx;
        this.k[j] = (this.k[j] ? this.k[j] + ' ' : '') + k;
      }
    }
    box(x, y, w, h, k, dashed) {
      const hz = dashed ? '- ' : '-';
      let top = '+';
      for (let i = 1; i < w - 1; i++) top += hz[(i - 1) % hz.length];
      top += '+';
      this.put(x, y, top, k); this.put(x, y + h - 1, top, k);
      for (let r = 1; r < h - 1; r++) {
        const g = dashed && r % 2 === 0 ? ':' : '|';
        this.put(x, y + r, g, k); this.put(x + w - 1, y + r, g, k);
      }
    }
    html() {
      const esc = (ch) => (ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch);
      const lines = [];
      for (let y = 0; y < this.h; y++) {
        let out = '', run = '', rk = null;
        for (let x = 0; x < this.w; x++) {
          const j = y * this.w + x;
          const k = this.k[j];
          if (k !== rk) {
            if (run) out += rk ? `<span class="${rk}">${run}</span>` : run;
            run = ''; rk = k;
          }
          run += esc(this.c[j]);
        }
        if (run) out += rk ? `<span class="${rk}">${run}</span>` : run;
        lines.push(out.replace(/\s+$/, ''));
      }
      return lines.join('\n');
    }
  }

  // ---------- helpers ----------
  // paint: write a panel line by line and touch only the lines that changed.
  // Replacing a whole panel eight times a second drops wheel scrolling in
  // WebKit (the gesture is tied to the node under the pointer), and a panel
  // that shrinks makes the page jump; its height only grows.
  function paint(el, html) {
    const lines = html ? html.split('\n') : [];
    const kids = el.children;
    while (kids.length > lines.length) el.lastChild.remove();
    while (kids.length < lines.length) {
      const d = document.createElement('div');
      d.className = 'ln';
      el.appendChild(d);
    }
    for (let i = 0; i < lines.length; i++) {
      if (kids[i]._h !== lines[i]) { kids[i].innerHTML = lines[i]; kids[i]._h = lines[i]; }
    }
    const h = el.offsetHeight;
    if (lines.length && h > (el._minH || 0)) { el._minH = h; el.style.minHeight = h + 'px'; }
  }

  let cw = 8;
  function measure() {
    const p = document.getElementById('probe');
    p.style.fontSize = getComputedStyle(document.body).fontSize;
    cw = p.getBoundingClientRect().width / 50 || 8;
  }
  const colsOf = (el) => Math.max(24, Math.floor(el.clientWidth / cw));
  const clip = (s, n) => { s = String(s || ''); return n <= 0 ? '' : s.length > n ? s.slice(0, Math.max(0, n - 1)) + '~' : s; };
  const pad = (s, n) => clip(s, n).padEnd(n);
  const two = (n) => String(n).padStart(2, '0');
  const dur = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h ? `${h}:${two(m)}:${two(s % 60)}` : `${two(m)}:${two(s % 60)}`;
  };
  const clock = (t) => { const d = new Date(t); return `${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`; };
  const kfmt = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n));
  function wrap(text, w, maxLines) {
    const words = String(text || '').split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '';
    for (const wd of words) {
      if (!cur) cur = wd;
      else if ((cur + ' ' + wd).length <= w) cur += ' ' + wd;
      else { lines.push(cur); cur = wd; }
    }
    if (cur) lines.push(cur);
    if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = clip(lines[maxLines - 1] + ' ...', w); }
    return lines.map((l) => clip(l, w));
  }
  const isLive = (a) => a.state === 'run' || a.state === 'start';
  // waitingNow: [key, actor] pairs Claude Code is waiting on the user for.
  const waitingNow = () => [['main', S.main], ...[...S.agents.entries()].filter(([, a]) => isLive(a))]
    .filter(([, o]) => o.wait && !S.ended);
  const stateTag = (a, f) => {
    if (a.wait && isLive(a)) return [REDUCE || f % 8 < 5 ? '[ASK]' : '[   ]', 'warn b'];
    if (a.state === 'start') return ['[..]', 'dim'];
    if (a.state === 'run') return [REDUCE ? '[..]' : `[${SPIN[f % 4]}.]`, agentTier(a)];
    if (a.state === 'pass') return ['[PASS]', 'ok b'];
    if (a.state === 'fail') return ['[FAIL]', 'err b'];
    if (a.state === 'risky') return ['[RISKY]', 'warn b'];
    return ['[ok]', 'ok'];
  };
  const tierBar = (tier) => {
    const r = RANK[tier];
    if (!r) return tier === 'grok' || tier === 'codex' ? '[ext]' : '[?]';
    return '[' + '#'.repeat(r) + '.'.repeat(4 - r) + ']';
  };

  let frame = 0;
  const now = () => (S.ended ? S.last : Math.max(Date.now(), S.last));

  // ---------- header ----------
  function renderHead(el) {
    const W = colsOf(el);
    const g = new Grid(W, 4);
    const f = frame;
    const title = 'ROUTE BOARD';
    g.put(0, 0, title, 'hi b');
    g.put(title.length + 2, 0, 'ogxo-route live agent map', 'dim');
    const meta = [S.host && S.host !== 'claude' ? S.host : '', S.repo, S.wt ? 'worktree ' + S.wt : '', S.branch, S.sid ? 'session ' + S.sid.slice(0, 8) : ''].filter(Boolean).join('  ');
    if (meta && W > title.length + 30 + meta.length) g.put(W - meta.length, 0, meta, 'dim');

    g.put(0, 1, '='.repeat(W), 'faint');
    if (S.working && !REDUCE) {
      const seg = '==#/#==';
      const span = W + seg.length;
      const pos = Math.floor((f * 1.2) % span) - seg.length;
      g.put(pos, 1, seg, 'opus');
    }

    let st, sc;
    if (S.offline && !DEMO) { st = 'o no events.js'; sc = 'err'; }
    else if (S.ended) { st = '# session ended'; sc = 'dim'; }
    else if (waitingNow().length) {
      const [k, o] = waitingNow()[0];
      st = W >= 90 ? `! waiting on you: ${labelOf(k)}, ${o.wait.what}` : `! waiting: ${labelOf(k)}`; sc = 'warn b';
    }
    else if (!DEMO && S.last && Date.now() - S.last > 90000 && (S.working || [...S.agents.values()].some(isLive))) {
      // Nothing for 90s while work is open: often a permission prompt waiting in the terminal.
      st = `! quiet ${dur(Date.now() - S.last)}${W >= 90 ? ', check the terminal for a prompt' : ''}`; sc = 'warn b';
    }
    else if (S.working || [...S.agents.values()].some(isLive)) { st = (REDUCE || f % 8 < 5 ? '*' : ' ') + ' working'; sc = 'opus'; }
    else { st = 'o idle'; sc = 'dim'; }
    const el2 = S.t0 ? dur(now() - S.t0) : '--:--';
    const right = `${st}   ${el2}`;
    let x = 0;
    for (const t of TIERS) {
      const label = ` ${t}`;
      if (x + 4 + label.length > W - right.length - 2) break;
      g.put(x, 2, '[#]', t + ' b'); g.put(x + 3, 2, label, 'fg');
      x += 3 + label.length + 3;
    }
    g.put(W - right.length, 2, st, sc); g.put(W - el2.length, 2, el2, 'hi');

    // Plan usage on the right of the last row; the tagline gives way to it.
    const lp = limitParts(LIM, Date.now());
    const lw = lp.reduce((n, [t]) => n + t.length + 3, lp.length ? 5 : 0);
    if (!lp.length || W - lw > 52) {
      g.put(2, 3, '> main plans + routes.', 'dim');
      if (!lp.length || W - lw > 80) g.put(25, 3, 'workers ship scoped work.', 'dim');
      if (!lp.length && W > 80) g.put(52, 3, 'reviews stay at opus+.', 'dim');
    }
    if (lp.length && lw <= W) {
      let lx = W - lw + 3;
      g.put(lx, 3, 'plan', 'dim'); lx += 5;
      for (const [t, c] of lp) { g.put(lx, 3, t, c); lx += t.length + 3; }
    }
    paint(el, g.html());
    document.getElementById('wtitle').textContent = `~/${S.repo || 'session'}  route board${DEMO ? '  (demo)' : ''}`;
  }

  // ---------- agent tree ----------
  const BOX_H = 11;
  function drawAgentBox(g, a, x, y, w, f) {
    const tier = agentTier(a);
    const live = isLive(a);
    const failed = a.state === 'fail';
    const bk = a.wait && live ? 'warn' : failed ? 'err' : live ? tier : 'faint';
    const tk = live || failed ? tier : 'dim';
    const ck = live ? 'fg' : 'dim';
    const iw = w - 4;
    g.box(x, y, w, BOX_H, bk, !live && !failed);
    const name = ' ' + clip(shortType(a.ty), iw - 10) + ' ';
    g.put(x + 2, y, name, tk + ' b');
    const model = ' ' + (a.x ? 'external' : tier === 'main' ? 'inherit' : tier) + ' ';
    g.put(x + w - 2 - model.length, y, model, tk);

    const eff = EFFORT[a.ty];
    const bar = tierBar(tier);
    g.put(x + 2, y + 1, bar, tk);
    if (eff) g.put(x + 3 + bar.length, y + 1, eff, ck);
    const el = dur((a.t1 || now()) - a.t0);
    g.put(x + w - 2 - el.length, y + 1, el, live ? 'hi' : 'dim');

    const desc = wrap(a.d || (a.x ? 'bridge run' : 'no description'), iw, 2);
    desc.forEach((l, i) => g.put(x + 2, y + 2 + i, l, live ? 'hi' : 'dim'));

    let sep = '.'.repeat(iw);
    const tags = [a.parent ? `via ${labelOf(a.parent)}` : '', a.wt ? `wt ${a.wt}` : ''].filter(Boolean).join('  ');
    if (tags) sep = '.. ' + tags + ' ' + '.'.repeat(Math.max(0, iw - tags.length - 4));
    g.put(x + 2, y + 4, clip(sep, iw), 'faint');
    if (a.wt) { const i = sep.indexOf(`wt ${a.wt}`); if (i >= 0 && i < iw) g.put(x + 2 + i, y + 4, clip(`wt ${a.wt}`, iw - i), 'codex'); }

    const tools = a.tools.slice(-3);
    tools.forEach((r, i) => {
      const yy = y + 5 + (3 - tools.length) + i;
      const newest = i === tools.length - 1;
      let lead = '>', lk = newest && live ? tier : 'faint';
      if (r.ok === false) { lead = 'x'; lk = 'err'; }
      else if (r.ok == null && newest && live && !REDUCE) lead = SPIN[f % 4];
      g.put(x + 2, yy, lead, lk);
      g.put(x + 4, yy, pad(r.n, 6), newest && live ? 'hi' : 'dim');
      g.put(x + 11, yy, clip(r.s, iw - 9), newest && live ? 'fg' : 'dim');
    });
    if (!tools.length) g.put(x + 2, y + 7, live ? 'starting' + '...'.slice(0, (f >> 2) % 4) : a.bf ? 'ran before the board was on' : 'no tool calls', 'dim');

    const [tag, tagk] = stateTag(a, f);
    g.put(x + 2, y + 9, tag, tagk);
    const stat = [a.tc ? `${a.tc} tools` : '', a.out ? `${kfmt(a.out)} out` : ''].filter(Boolean).join(' ');
    g.put(x + w - 2 - stat.length, y + 9, stat, 'dim');
  }

  function drawPath(g, path, a, f) {
    const live = isLive(a);
    const tier = agentTier(a);
    const back = a.returnAt && now() - a.returnAt < 2200 && !REDUCE;
    path.forEach(([x, y, ch], i) => {
      let k = live ? 'dim' : 'faint';
      let glyph = ch;
      if (live && !REDUCE && ch !== 'v' && (i - Math.floor(f / 1.5)) % 5 === 0) { glyph = ch === '-' ? '=' : ':'; k = tier + ' b'; }
      if (back && ch !== 'v') {
        const head = path.length - 1 - Math.floor(((now() - a.returnAt) / 2200) * (path.length + 4));
        if (i <= head + 1 && i >= head - 1) { glyph = ch === '-' ? '<' : '^'; k = (a.state === 'fail' ? 'err' : 'ok') + ' b'; }
      }
      if (ch === 'v') k = live ? tier + ' b' : 'faint';
      g.put(x, y, glyph, k);
    });
  }

  function drawMainBox(g, x, y, w, f) {
    const live = S.working;
    g.box(x, y, w, 5, live ? 'hi' : 'dim');
    g.put(x + 2, y, ' main session ', 'hi b');
    const tag = ' plans + routes ';
    if (w > 36) g.put(x + w - 2 - tag.length, y, tag, 'dim');
    const iw = w - 4;
    const last = S.main.tools[S.main.tools.length - 1];
    let line, lk = 'fg';
    if (!S.loaded && !DEMO) { line = 'loading events.js ...'; lk = 'dim'; }
    else if (S.offline && !DEMO) { line = 'cannot read events.js next to this page'; lk = 'err'; }
    else if (!S.t0) { line = 'waiting for the first event from this session'; lk = 'dim'; }
    else if (S.ended) { line = 'session ended'; lk = 'dim'; }
    else if (!live) { line = 'idle, waiting for a prompt'; lk = 'dim'; }
    else if (S.main.wait) { line = `! ${S.main.wait.what}`; lk = 'warn b'; }
    else if (last && now() - last.t < 4000) line = `${REDUCE ? '>' : SPIN[f % 4]} ${pad(last.n, 6)} ${last.s}`;
    else { line = 'thinking' + '...'.slice(0, (f >> 2) % 4); lk = 'opus'; }
    g.put(x + 2, y + 1, 'now ', 'dim');
    g.put(x + 6, y + 1, clip(line, iw - 4), lk);
    const all = [...S.agents.values()];
    const runningAgents = all.filter(isLive);
    const running = runningAgents.length;
    if (running) {
      g.put(x + 2, y + 2, 'with', 'dim');
      let xx = x + 7;
      for (const a of runningAgents) {
        const n = shortType(a.ty);
        if (xx + n.length > x + w - 3) { g.put(xx, y + 2, '...', 'dim'); break; }
        g.put(xx, y + 2, n, agentTier(a)); xx += n.length + 2;
      }
    }
    const turn = S.turnAt && live ? dur(now() - S.turnAt) : '--:--';
    const stats = `turn ${turn}   tools ${S.main.tc}   agents ${running} running / ${all.length}   advisor ${S.advisor.length}`;
    g.put(x + 2, y + 3, clip(stats, iw), 'dim');
    if (running) g.put(x + 2 + stats.indexOf('agents') + 7, y + 3, String(running), 'opus b');
  }

  function pickAgents(max) {
    const all = [...S.agents.values()].sort((p, q) => p.t0 - q.t0);
    const live = all.filter(isLive);
    const done = all.filter((a) => !isLive(a));
    const room = Math.max(0, max - live.length);
    // slice(-0) is slice(0), every item: take no finished agents when there is no room.
    const shown = live.slice(-max).concat(room ? done.slice(-room) : []).sort((p, q) => p.t0 - q.t0);
    const hidden = all.filter((a) => !shown.includes(a));
    return { shown, hidden };
  }

  function renderTree(el) {
    const W = colsOf(el);
    const f = frame;
    const gap = 2;
    const bw = Math.max(26, Math.min(34, Math.floor((W - gap * 3) / 4)));
    const perRow = Math.max(1, Math.floor((W + gap) / (bw + gap)));
    const horizontal = perRow >= 3;
    const { shown, hidden } = pickAgents(horizontal ? perRow : 4);
    let H;
    if (horizontal) H = 5 + 3 + (shown.length ? BOX_H : 1) + (hidden.length ? 2 : 0);
    else H = 5 + shown.length * (BOX_H + 1) + 1 + (hidden.length ? 2 : 0);
    const g = new Grid(W, H);

    if (horizontal) {
      const mw = Math.min(W, 60);
      const mx = Math.floor((W - mw) / 2);
      drawMainBox(g, mx, 0, mw, f);
      const cx = mx + Math.floor(mw / 2);
      if (!shown.length) {
        g.put(cx, 5, ':', 'faint');
        g.put(Math.max(0, cx - 22), 6, 'agents appear here when work is dispatched', 'dim');
      } else {
        const totalW = shown.length * bw + (shown.length - 1) * gap;
        const x0 = Math.floor((W - totalW) / 2);
        const centers = shown.map((_, i) => x0 + i * (bw + gap) + Math.floor(bw / 2));
        const lo = Math.min(cx, centers[0]), hi = Math.max(cx, centers[centers.length - 1]);
        g.put(cx, 5, '|', 'faint');
        g.put(lo, 6, '+' + '-'.repeat(Math.max(0, hi - lo - 1)) + (hi > lo ? '+' : ''), 'faint');
        g.put(cx, 6, '+', 'faint');
        shown.forEach((a, i) => {
          const c = centers[i];
          const path = [[cx, 5, '|']];
          const step = c >= cx ? 1 : -1;
          for (let xx = cx; xx !== c; xx += step) path.push([xx, 6, xx === cx ? '+' : '-']);
          path.push([c, 6, '+']);
          path.push([c, 7, 'v']);
          drawPath(g, path, a, f);
          drawAgentBox(g, a, x0 + i * (bw + gap), 8, bw, f);
        });
      }
    } else {
      const mw = Math.min(W, 60);
      drawMainBox(g, 0, 0, mw, f);
      const tx = 2;
      const boxW = Math.min(W - 6, 44);
      shown.forEach((a, i) => {
        const by = 6 + i * (BOX_H + 1);
        const mid = by + 1;
        const path = [];
        for (let yy = 5; yy < mid; yy++) path.push([tx, yy, '|']);
        path.push([tx, mid, '+']); path.push([tx + 1, mid, '-']); path.push([tx + 2, mid, '-']); path.push([tx + 3, mid, '>']);
        const drawn = path.map(([x, y, ch]) => [x, y, ch === '>' ? 'v' : ch]);
        drawPath(g, drawn, a, f);
        g.put(tx + 3, mid, '>', isLive(a) ? agentTier(a) + ' b' : 'faint');
        drawAgentBox(g, a, tx + 4, by, boxW, f);
      });
      if (!shown.length) g.put(2, 6, 'agents appear here when work is dispatched', 'dim');
    }

    if (hidden.length) {
      const y = H - 1;
      let x = 0;
      g.put(x, y, 'earlier', 'dim'); x += 9;
      const list = hidden.slice(-12);
      for (const a of list) {
        const [tag, tk] = stateTag(a, f);
        const n = shortType(a.ty);
        if (x + n.length + tag.length + 3 > W - 6) break;
        g.put(x, y, n, agentTier(a)); x += n.length + 1;
        g.put(x, y, tag, tk); x += tag.length + 2;
      }
      const extra = hidden.length - list.length;
      if (extra > 0) g.put(x, y, `+${extra}`, 'dim');
    }
    paint(el, g.html());
  }

  // ---------- batch ----------
  function batchState(row) {
    const w = String(row.writer || '').toLowerCase();
    const task = String(row.task || '').toLowerCase();
    let match = null;
    if (w === 'grok' || w === 'codex') match = S.agents.get('x:' + w) || null;
    if (!match) {
      for (const a of S.agents.values()) {
        const d = String(a.d || '').toLowerCase();
        if (task && d && (d.includes(task) || task.includes(d))) match = a;
      }
    }
    return match;
  }
  function renderBatch(el) {
    if (!S.batch || !S.batch.rows.length) { paint(el, ''); el.style.marginBottom = '0'; return; }
    el.style.marginBottom = '1.5em';
    const W = colsOf(el);
    const rows = S.batch.rows;
    const g = new Grid(W, rows.length + 4);
    const modes = [...new Set(rows.map((r) => r.mode).filter(Boolean))].join('/') || 'shared';
    g.box(0, 0, W, rows.length + 4, 'faint');
    g.put(2, 0, ` batch  ${rows.length} tasks  ${modes} `, 'opus b');
    const cT = Math.max(14, Math.min(32, Math.floor(W * 0.3)));
    const cW = 12, cS = 10, cM = 20;
    const cF = Math.max(8, W - 6 - cT - cW - cS - cM - 4);
    let x = 4;
    const hdr = [['task', cT], ['writer', cW], ['mode', cM], ['files', cF], ['state', cS]];
    for (const [h, n] of hdr) { g.put(x, 1, pad(h, n), 'dim'); x += n + 1; }
    rows.forEach((r, i) => {
      const y = 2 + i;
      const a = batchState(r);
      const live = a && isLive(a);
      const failed = a && a.state === 'fail';
      g.put(2, y, live ? '>' : ' ', 'opus b');
      const wt = String(r.writer || '').toLowerCase();
      const wk = wt === 'grok' || wt === 'codex' ? wt : a ? agentTier(a) : 'fg';
      let xx = 4;
      g.put(xx, y, pad(r.task, cT), live ? 'hi b' : 'fg'); xx += cT + 1;
      g.put(xx, y, pad(r.writer, cW), wk); xx += cW + 1;
      const wtn = r.worktree ? String(r.worktree).replace(/\/+$/, '').split('/').pop() : '';
      g.put(xx, y, pad(wtn ? `wt ${wtn}` : (r.mode || 'shared'), cM), wtn ? 'codex' : 'dim'); xx += cM + 1;
      const files = Array.isArray(r.files) ? r.files.join(' ') : String(r.files || '');
      g.put(xx, y, pad(files, cF), 'dim'); xx += cF + 1;
      const [tag, tk] = a ? stateTag(a, frame) : ['queued', 'dim'];
      g.put(xx, y, tag, tk);
      if (live) g.paint(1, y, W - 2, 'hl');
      if (failed) g.paint(1, y, W - 2, 'hlerr');
    });
    paint(el, g.html());
  }

  // ---------- timeline ----------
  function renderTime(el) {
    const W = colsOf(el);
    const f = frame;
    const all = [...S.agents.values()].sort((p, q) => p.t0 - q.t0);
    const lanesMax = 9;
    const lanes = [{ label: 'main', k: 'main', obj: S.main }]
      .concat(all.slice(-lanesMax).map((a) => ({ label: shortType(a.ty), k: agentTier(a), obj: a })));
    const H = lanes.length + 5;
    const g = new Grid(W, H);
    g.box(0, 0, W, H, 'faint');
    g.put(2, 0, ' session timeline ', 'hi b');
    const lw = 12;
    const tx = 2 + lw;
    const tw = Math.max(10, W - tx - 3);
    const t0 = S.tAct || S.t0 || Date.now();
    const t1 = Math.max(now(), t0 + 1000);
    const span = t1 - t0;
    const bucket = (t) => Math.min(tw - 1, Math.max(0, Math.floor(((t - t0) / span) * tw)));

    lanes.forEach((ln, i) => {
      const y = 1 + i;
      g.put(2, y, pad(ln.label, lw - 1), ln.k === 'main' ? 'hi' : ln.k);
      const counts = new Array(tw).fill(0);
      const errs = new Array(tw).fill(false);
      const advs = new Array(tw).fill(false);
      const waits = new Array(tw).fill(false);
      for (const m of ln.obj.marks) {
        const b = bucket(m.t);
        if (m.kind === 'err') errs[b] = true;
        else if (m.kind === 'adv') advs[b] = true;
        else if (m.kind === 'wait') waits[b] = true;
        else counts[b]++;
      }
      const alive = new Array(tw).fill(false);
      if (ln.obj === S.main) {
        for (const [s, e] of S.turns) for (let b = bucket(s); b <= bucket(e || t1); b++) alive[b] = true;
      } else {
        for (let b = bucket(ln.obj.t0); b <= bucket(ln.obj.t1 || t1); b++) alive[b] = true;
      }
      let row = '';
      const ks = [];
      for (let b = 0; b < tw; b++) {
        let ch = '.', k = 'faint';
        if (errs[b]) { ch = 'x'; k = 'err b'; }
        else if (waits[b]) { ch = '!'; k = 'warn b'; }
        else if (advs[b]) { ch = '<'; k = 'fable b'; }
        else if (b > 0 && advs[b - 1]) { ch = '>'; k = 'fable b'; }
        else if (counts[b] >= 3) { ch = '#'; k = ln.k; }
        else if (counts[b] === 2) { ch = '|'; k = ln.k; }
        else if (counts[b] === 1) { ch = ':'; k = ln.k; }
        else if (alive[b]) { ch = '='; k = ln.k === 'main' ? 'dim' : ln.k; }
        row += ch; ks.push(k);
      }
      for (let b = 0; b < tw; b++) g.put(tx + b, y, row[b], ks[b] === 'main' ? 'hi' : ks[b]);
      if (ln.obj.state === 'pass' || ln.obj.state === 'fail' || ln.obj.state === 'risky') {
        const [tag, tk] = stateTag(ln.obj, f);
        const b = bucket(ln.obj.t1 || t1);
        if (b + 2 + tag.length < tw) g.put(tx + b + 2, y, tag, tk);
      }
    });
    const cur = tw - 1;
    if (!S.ended) for (let i = 0; i < lanes.length; i++) g.put(tx + cur, 1 + i, REDUCE || f % 8 < 5 ? '|' : ' ', 'hi b');

    const ay = lanes.length + 1;
    let axis = '+';
    for (let b = 1; b < tw; b++) axis += b % Math.max(8, Math.floor(tw / 6)) === 0 ? '+' : '-';
    g.put(tx, ay, axis, 'faint');
    if (S.batch) {
      const b = bucket(S.batch.t);
      g.put(tx + b, ay, '^', 'opus b');
      g.put(tx + Math.min(b, tw - 6), ay + 1, 'batch', 'opus');
    }
    g.put(tx, ay + 2, S.t0 ? clock(t0) : '', 'dim');
    const nowLabel = S.ended ? 'ended ' + clock(t1) : 'now ' + clock(t1);
    g.put(tx + tw - nowLabel.length, ay + 2, nowLabel, 'dim');
    const legend = ': 1  | 2  # 3+ calls   = running   x error   ! waited on you   <> advisor';
    if (tw > legend.length + 30) g.put(tx + Math.floor((tw - legend.length) / 2), ay + 2, legend, 'faint');
    paint(el, g.html());
  }

  // ---------- tiers + log ----------
  const PANEL_H = 12;
  function renderTiers(el) {
    const W = colsOf(el);
    const g = new Grid(W, PANEL_H);
    g.box(0, 0, W, PANEL_H, 'faint');
    g.put(2, 0, ' who did the work ', 'hi b');
    const agentsBy = {};
    for (const a of S.agents.values()) { const t = agentTier(a); agentsBy[t] = (agentsBy[t] || 0) + 1; }
    const order = ['main', ...TIERS];
    const total = Object.values(S.tierTools).reduce((p, q) => p + q, 0);
    const max = Math.max(1, ...order.map((t) => S.tierTools[t] || 0));
    const bw = Math.max(6, W - 4 - 8 - 6 - 16);
    let y = 2;
    for (const t of order) {
      const n = S.tierTools[t] || 0;
      const ag = agentsBy[t] || 0;
      if (!n && !ag) continue;
      if (y > PANEL_H - 4) break;
      const fill = Math.round((n / max) * bw);
      g.put(2, y, pad(t, 7), t === 'main' ? 'hi' : t);
      g.put(10, y, '#'.repeat(fill), t === 'main' ? 'hi' : t);
      g.put(10 + fill, y, '.'.repeat(bw - fill), 'faint');
      const pct = total ? Math.round((n / total) * 100) : 0;
      const tail = `${String(pct).padStart(3)}%  ${t === 'main' ? '' : ag + ' ag'}`;
      g.put(11 + bw, y, tail, 'dim');
      y++;
    }
    if (S.advisor.length && y <= PANEL_H - 4) {
      g.put(2, y, pad('advisor', 7), 'fable');
      const marks = '<> '.repeat(Math.min(S.advisor.length, Math.floor(bw / 3))).trimEnd();
      g.put(10, y, marks, 'fable b');
      g.put(11 + bw, y, `${S.advisor.length} call${S.advisor.length === 1 ? '' : 's'}`, 'dim');
      y++;
    }
    if (!total) g.put(2, 2, 'tool calls per model tier show up here', 'dim');
    const cheap = ['sonnet', 'haiku', 'grok', 'codex'].reduce((p, t) => p + (S.tierTools[t] || 0), 0);
    if (total) {
      const pct = Math.round((cheap / total) * 100);
      const line = `${pct}% of tool calls ran below the main session's tier`;
      g.put(2, PANEL_H - 2, clip(line, W - 4), 'fg');
      g.put(2, PANEL_H - 2, `${pct}%`, 'haiku b');
    }
    paint(el, g.html());
  }

  // Failed tool calls, newest first: when, who, the call's summary, and the
  // last line of its error as the hook recorded it.
  const ERR_ROWS = 12;
  function renderErrors(el) {
    const wrap = document.getElementById('errwrap');
    wrap.hidden = !S.errs.length;
    if (!S.errs.length) return;
    const W = colsOf(el);
    const items = S.errs.slice(-ERR_ROWS).reverse();
    const H = items.length + 3;
    const g = new Grid(W, H);
    g.box(0, 0, W, H, 'faint');
    g.put(2, 0, ' errors ', 'err b');
    const note = S.errs.length > items.length ? ` newest ${items.length} of ${S.errs.length} ` : ` ${S.errs.length} `;
    g.put(W - note.length - 2, 0, note, 'dim');
    const callW = Math.max(12, Math.min(40, Math.floor((W - 30) * 0.4)));
    g.put(2, 1, pad('time', 8), 'dim');
    g.put(11, 1, pad('who', 12), 'dim');
    g.put(24, 1, pad('call', callW), 'dim');
    g.put(25 + callW, 1, 'error', 'dim');
    items.forEach((it, i) => {
      const y = 2 + i;
      const who = it.k === 'main' ? S.main : S.agents.get(it.k);
      g.put(2, y, clock(it.t), 'faint');
      g.put(11, y, pad(labelOf(it.k), 12), it.k === 'main' ? 'hi' : who ? agentTier(who) : 'fg');
      g.put(24, y, pad(`${it.n} ${it.s}`.trim(), callW), 'fg');
      g.put(25 + callW, y, clip(it.r || '(no message recorded)', W - callW - 27), it.r ? 'err' : 'dim');
    });
    paint(el, g.html());
  }

  // Tokens and list-price cost per agent type, and what the workers' tokens
  // would have cost on the main session's model.
  function renderUsage(el) {
    const W = colsOf(el);
    const rowsBy = new Map();
    const mainOut = {};
    let reported = false;
    for (const r of S.use) {
      let label, tier;
      if (r.who === 'main') { label = 'main'; tier = 'main'; mainOut[r.m] = (mainOut[r.m] || 0) + (r.u.out || 0) + 1; }
      else if (r.who === 'advisor') { label = 'advisor'; tier = 'fable'; }
      else { const a = S.agents.get(r.who); label = shortType(a ? a.ty : 'agent'); tier = tierOf(r.m) || (a ? agentTier(a) : 'main'); }
      const key = label + '|' + r.m;
      const row = rowsBy.get(key) || { label, tier, m: r.m, worker: r.who !== 'main' && r.who !== 'advisor', n: new Set(), u: { in: 0, out: 0, cr: 0, cw5: 0, cw1: 0 } };
      for (const f of ['in', 'out', 'cr', 'cw5', 'cw1']) row.u[f] += r.u[f] || 0;
      if (typeof r.u.c === 'number') { row.u.c = (row.u.c || 0) + r.u.c; reported = true; }
      if (row.worker) row.n.add(r.who);
      rowsBy.set(key, row);
    }
    const rows = [...rowsBy.values()].sort((p, q) => (p.label === 'main' ? -1 : q.label === 'main' ? 1 : (q.u.out + q.u.cr) - (p.u.out + p.u.cr)));
    const mainModel = Object.entries(mainOut).sort((p, q) => q[1] - p[1])[0]?.[0] || null;
    const H = Math.max(6, rows.length + 8);
    const g = new Grid(W, H);
    g.box(0, 0, W, H, 'faint');
    g.put(2, 0, ' tokens and cost ', 'hi b');
    const note = reported ? ' list prices, and grok costs as grok reports them ' : ' list prices, not your plan\'s billing ';
    if (W > 40) g.put(W - note.length - 2, 0, note, 'dim');
    if (!rows.length) {
      g.put(2, 2, 'token use shows up here after the first turn ends or a worker returns', 'dim');
      paint(el, g.html());
      return;
    }
    // Claude models show as their tier; other hosts' models by their full id.
    const mw = Math.max(9, ...rows.map((r) => String(tierOf(r.m) || r.m).length));
    const cols = [['who', 14], ['model', mw], ['input', 8], ['cache rd', 9], ['cache wr', 9], ['output', 8], ['cost', 9]];
    let x = 2;
    for (const [h, w] of cols) { g.put(x, 1, pad(h, w), 'dim'); x += w + 1; }
    let total = 0, known = true, workers = 0, asMain = 0, floors = false;
    rows.forEach((r, i) => {
      const c = costOf(r.u, r.m);
      if (c == null) known = false; else total += c;
      if (r.worker && c != null) {
        workers += c;
        const cm = mainModel ? costOf(r.u, mainModel) : null;
        asMain += cm == null ? c : Math.max(c, cm);
      }
      const y = 2 + i;
      const who = r.worker && r.n.size > 1 ? `${r.label} x${r.n.size}` : r.label;
      // Subagent transcripts log each reply's usage before it finishes streaming,
      // so a worker's output count (and its cost) is a floor.
      // A worker read from a Claude Code transcript is a floor (+); a host's own totals are not.
      const floor = r.worker && typeof r.u.c !== 'number';
      if (floor) floors = true;
      const cells = [who, tierOf(r.m) || r.m, kfmt(r.u.in), kfmt(r.u.cr), kfmt(r.u.cw5 + r.u.cw1), kfmt(r.u.out) + (floor ? '+' : ''), usd(c) + (floor ? '+' : '')];
      let xx = 2;
      cells.forEach((v, j) => {
        const w = cols[j][1];
        const k = j === 0 ? (r.tier === 'main' ? 'hi' : r.tier) : j === 1 ? (tierOf(r.m) || 'dim') : j === 6 ? 'fg' : 'dim';
        g.put(xx, y, j >= 2 ? String(v).padStart(w) : pad(v, w), k);
        xx += w + 1;
      });
    });
    const ty = 2 + rows.length;
    g.put(2, ty, pad('total', 14), 'hi b');
    g.put(2 + 14 + 1 + mw + 1 + (8 + 1) + (9 + 1) * 2 + (8 + 1), ty, usd(total).padStart(9) + (known ? '' : ' +?'), 'hi b');
    let line;
    if (workers > 0 && mainModel && asMain > workers + 0.005) {
      const fl = floors ? '+' : '';
      line = `workers ${usd(workers)}${fl}; the same tokens at ${tierOf(mainModel) || mainModel} prices ${usd(asMain)}${fl}, a difference of ${usd(asMain - workers)}${fl}`;
      g.put(2, ty + 2, clip(line, W - 4), 'fg');
      const at = line.indexOf('a difference of');
      if (at >= 0 && at < W - 4) g.put(2 + at, ty + 2, clip(line.slice(at), W - 4 - at), 'haiku b');
    } else if (workers > 0) {
      line = `workers ${usd(workers)}${floors ? '+' : ''}, all on the main session's tier or above`;
      g.put(2, ty + 2, clip(line, W - 4), 'fg');
    }
    const runs = S.host === 'grok' ? 'grok bridge runs do not apply here; codex runs not counted' : 'grok and codex runs not counted';
    const foot = S.usePartial ? `main session counted from when the board was turned on; ${runs}`
      : `${runs}; the brief each worker gets is in the main session's tokens`;
    let fy = ty + 3;
    if (floors) g.put(2, fy++, clip('+ a floor: subagent transcripts log a reply\'s output tokens before it finishes, so workers\' output reads low', W - 4), 'dim');
    g.put(2, fy, clip(foot, W - 4), 'dim');
    paint(el, g.html());
  }

  function renderLog(el) {
    const W = colsOf(el);
    const g = new Grid(W, PANEL_H);
    g.box(0, 0, W, PANEL_H, 'faint');
    g.put(2, 0, ' log ', 'hi b');
    const rows = PANEL_H - 3;
    const items = S.log.slice(-rows);
    items.forEach((it, i) => {
      const y = 1 + (rows - items.length) + i;
      const newest = i === items.length - 1;
      const who = it.k === 'main' ? S.main : S.agents.get(it.k);
      const tk = it.k === 'main' ? 'hi' : who ? agentTier(who) : 'fg';
      g.put(2, y, clock(it.t), 'faint');
      g.put(11, y, pad(labelOf(it.k), 12), tk);
      g.put(24, y, pad(it.verb, 8), it.cls || (newest ? 'hi' : 'dim'));
      g.put(33, y, clip(it.text, W - 35), it.cls && it.cls !== 'dim' ? it.cls : newest ? 'fg' : 'dim');
    });
    const py = PANEL_H - 2;
    g.put(2, py, 'log >', 'dim');
    const last = S.log[S.log.length - 1];
    if (last) g.put(8, py, clip(`${labelOf(last.k)} ${last.verb} ${last.text}`, W - 12), 'fg');
    const cx = last ? Math.min(W - 3, 9 + clip(`${labelOf(last.k)} ${last.verb} ${last.text}`, W - 12).length) : 8;
    if (!REDUCE && frame % 8 < 4 && !S.ended) g.put(cx, py, '_', 'hi b');
    paint(el, g.html());
  }

  function renderFoot(el) {
    const W = colsOf(el);
    const g = new Grid(W, 1);
    const all = [...S.agents.values()];
    const running = all.filter(isLive).length;
    const fails = all.filter((a) => a.state === 'fail').length;
    const parts = [
      ['agents', `[${running}/${all.length}]`, running ? 'opus' : 'dim'],
      ['tools', `[${S.toolCount}]`, 'fg'],
      ['errors', `[${S.errors}]`, S.errors ? 'err' : 'dim'],
      ['verifier fails', `[${fails}]`, fails ? 'err' : 'dim'],
      ['advisor', `[${S.advisor.length}]`, S.advisor.length ? 'fable' : 'dim'],
      ['waited on you', `[${S.waits}]`, S.waits ? 'warn' : 'dim'],
    ];
    if (!S.advisor.length && all.some((a) => a.ty === 'ogxo-route:implementer-risky')) parts.push(['impl-risky ran,', 'no advisor call seen', 'warn']);
    let x = 0;
    for (const [k, v, c] of parts) {
      if (x + k.length + v.length + 3 > W - 18) break;
      g.put(x, 0, k + ' ', 'dim'); x += k.length + 1;
      g.put(x, 0, v, c); x += v.length + 3;
    }
    const age = S.last ? Math.floor((Date.now() - S.last) / 1000) : null;
    const right = DEMO ? 'demo replay  t theme' : age == null ? 't theme' : `last event ${age < 60 ? age + 's' : dur(age * 1000)} ago  t theme`;
    g.put(W - right.length, 0, right, 'faint');
    paint(el, g.html());
  }

  // ---------- loop ----------
  const els = ['head', 'tree', 'batch', 'time', 'tiers', 'log', 'errors', 'usage', 'foot'].reduce((o, id) => { o[id] = document.getElementById(id); return o; }, {});
  function render() {
    if (document.hidden) return;
    frame++;
    renderHead(els.head);
    renderTree(els.tree);
    renderBatch(els.batch);
    renderTime(els.time);
    renderTiers(els.tiers);
    renderLog(els.log);
    renderErrors(els.errors);
    renderUsage(els.usage);
    renderFoot(els.foot);
  }

  // ---------- live feed ----------
  // The hooks append one `E({...});` line per event to events.js next to this
  // page. A script tag loads from file:// where fetch() usually can't, so the
  // page re-adds one each poll and ingests only the lines it hasn't seen.
  let seen = 0, loading = false;
  // Plan usage, shared by every board: ../limits.js, re-read every few seconds.
  let LIM = null, limAt = 0;
  function pollLimits() {
    if (Date.now() - limAt < 5000) return;
    limAt = Date.now();
    const s = document.createElement('script');
    window.L = (x) => { LIM = x; };
    s.src = '../limits.js?' + Date.now();
    s.onload = s.onerror = () => s.remove();
    document.head.appendChild(s);
  }
  function poll() {
    if (loading) return;
    loading = true;
    const got = [];
    window.E = (ev) => { got.push(ev); };
    const s = document.createElement('script');
    s.src = 'events.js?' + Date.now();
    const done = () => { s.remove(); loading = false; };
    s.onload = () => {
      S.loaded = true; S.offline = false;
      if (got.length < seen) { reset(); S.loaded = true; seen = 0; }
      // One malformed event must not stop the board: skip it and keep going.
      for (let i = seen; i < got.length; i++) { try { ingest(got[i]); } catch (err) { console.warn('route board: skipped event', i, err); } }
      seen = got.length;
      done();
    };
    s.onerror = () => { S.loaded = true; S.offline = true; done(); };
    document.head.appendChild(s);
  }
